name: Build and optionally publish Docker image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested image to GHCR (default branch only)
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Derive repository image and full commit tag
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'name=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'tag=%s:sha-%s\n' "$image" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build local test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test the installed runtime without network access
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: docker run --rm --network none "$IMAGE" python -m unittest test.services.test_container_runtime

      - name: Explain blocked publication from another branch
        if: ${{ inputs.publish && github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: echo "::warning::Publishing requires the repository default branch. This run only builds and tests."

      - name: Summarize verification
        env:
          IMAGE: ${{ steps.image.outputs.tag }}
        run: printf 'Built and tested `%s` for `linux/amd64` without publishing.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the verified commit
    needs: build
    if: ${{ inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ needs.build.outputs.image }}
      tag: ${{ needs.build.outputs.tag }}
      digest: ${{ steps.publication.outputs.digest }}
      image_ref: ${{ steps.publication.outputs.image_ref }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Load publication image using the verified build cache
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ needs.build.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cache reuse is an optimization; test this exact image again before push.
      - name: Test publication image without network access
        env:
          IMAGE: ${{ needs.build.outputs.tag }}
        run: docker run --rm --network none "$IMAGE" python -m unittest test.services.test_container_runtime

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested image and record immutable deployment reference
        id: publication
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          docker push "$TAG"
          # Missing, unrelated, or multiple repository digests must fail closed.
          image_ref="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$TAG" | grep -F -- "$IMAGE@sha256:")"
          digest="${image_ref#"$IMAGE"@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'digest=%s\nimage_ref=%s\n' "$digest" "$image_ref" >> "$GITHUB_OUTPUT"
          printf 'Published `%s`.\n\nDeploy with `MPT_IMAGE=%s`.\n' "$TAG" "$image_ref" >> "$GITHUB_STEP_SUMMARY"
