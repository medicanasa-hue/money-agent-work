# -----------------------------------------------------------------------------
# Speech, Subtitles, and Video / 语音、字幕与视频
# -----------------------------------------------------------------------------

# Xiaomi MiMo TTS shares mimo_api_key and mimo_base_url with the MiMo LLM.
mimo_tts_model_name = "mimo-v2.5-tts"
mimo_tts_style_prompt = "请用自然、清晰、适合短视频旁白的语气朗读。"

# Subtitle provider: "edge" or "whisper". Whisper is loaded only when selected
# explicitly; Edge failures do not trigger an automatic Whisper model download.
# Leave empty to skip generation.
subtitle_provider = "edge"

# Custom audio files do not include the subtitle timeline normally returned by
# TTS providers such as Edge. Use Whisper by default so uploaded/server-side
# audio still gets subtitles. Set to "none" to skip subtitles unless
# subtitle_provider is explicitly "whisper".
custom_audio_subtitle_provider = "whisper"

# FFmpeg is normally downloaded and detected automatically. If detection fails,
# download it from https://www.gyan.dev/ffmpeg/builds/ and set the executable.
# Windows example: ffmpeg_path = "C:\\path\\to\\ffmpeg.exe"
# ffmpeg_path = ""

# Leave unset to follow the app default (libx264). Hardware encoders are optional;
# unsupported encoders automatically fall back to libx264.
# Available values: "libx264", "h264_nvenc", "h264_amf", "h264_qsv",
# "h264_mf", "h264_videotoolbox".
# video_codec = "libx264"

# libx264 CRF quality level. Lower means higher quality and larger files.
# video_crf = 20
# Optional AMF-only I-frame QP (0-49). This leaves video_crf unchanged for
# automatic libx264 fallback; calibrate it on the target AMD GPU before use.
# video_amf_qp_i = 20
# Optional conservative cleanup for visible color banding in compressed B-roll.
# video_deband_enabled = false
# Output frame rate and final audio bitrate.
# video_fps = 30
# audio_bitrate = "192k"
# Normalize generated or imported narration before final rendering.
# audio_loudness_normalization_enabled = false
# libx264 preset; slower values can reduce size at the same CRF.
# video_encoder_preset = "medium"

# -----------------------------------------------------------------------------
# Storage and Task Runtime / 存储与任务运行
# -----------------------------------------------------------------------------

# Public base URL used to build generated video download links. Leave empty to
# use the current API service address, or set an external reverse-proxy URL.
endpoint = ""

# Material storage: "" uses ./storage/cache_videos, "task" stores materials in
# each task directory, and an absolute path stores materials in that directory.
# Example: material_directory = "/path/to/videos"
material_directory = ""

# Optionally prioritize the strongest provider previews among the top ranked
# online video candidates before downloading full files. This adds to the
# existing weak-preview rejection safeguard and can make material search a
# little slower, so it is disabled by default.
# preview_quality_rerank_enabled = false
# preview_quality_rerank_max_candidates = 3

# Maximum candidate material duration in seconds. Set 0 to disable the upper
# duration filter. Very long stock clips are usually less relevant for shorts.
max_material_duration = 180

# Video material search diversity. 1 keeps the default first-page search.
# Increase to 2-5 to let Pexels/Pixabay/Coverr sample different result pages.
# Higher values may improve variety, but can use more API quota or return fewer matches.
material_search_max_page = 1
# Optional per-source overrides. Uncomment only when you want source-specific behavior.
# pexels_search_max_page = 1
# pixabay_search_max_page = 1
# coverr_search_max_page = 1

# Skip recently used online video URLs when enough fresh candidates exist.
# Disabled by default to preserve the original material selection behavior.
video_cooldown_enabled = false
# Supported UI values: 3, 7, 14, 30.
video_cooldown_days = 7

# Used for state management of the task.
# Redis is expected to be private to this app. Do not expose it to untrusted
# writers, because task state is deserialized for compatibility with existing
# records.
enable_redis = false
redis_host = "localhost"
redis_port = 6379
redis_db = 0
redis_password = ""

# Maximum number of concurrent and queued API video-generation tasks.
max_concurrent_tasks = 5
max_queued_tasks = 100

# -----------------------------------------------------------------------------
# Cross-platform Publishing / 跨平台发布
# -----------------------------------------------------------------------------

# Upload-Post can publish generated videos to TikTok, Instagram, and YouTube.
# Create an account and API key at https://upload-post.com/
# API documentation: https://docs.upload-post.com/
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
# Available values: "tiktok", "instagram", "youtube".
upload_post_platforms = ["tiktok", "instagram"]
# Mark TikTok uploads as AI-generated content.
upload_post_tiktok_is_aigc = false
# Automatically publish successful video outputs after generation.
upload_post_auto_upload = false
# Keep generated uploads in the review queue until the user confirms them.
upload_post_require_review = true
# YouTube privacy: "public", "unlisted", or "private".
upload_post_youtube_privacy_status = "unlisted"
# Public YouTube publishing needs an additional explicit opt-in.
upload_post_allow_public_youtube = false
# Maximum number of running and queued cross-post jobs per process. When the
# limit is reached, video generation still succeeds and only cross-posting is
# rejected.
# Cross-post jobs run in the current process and are not resumed after restart.
upload_post_max_pending_tasks = 10

# =============================================================================
# Whisper Subtitles / Whisper 字幕
# =============================================================================

[whisper]
# The model is downloaded automatically on first use unless a matching local
# directory exists at ./models/whisper-{model_size}.
model_size = "large-v3"
# Retries with this multilingual model only when the primary model cannot load
# because of memory pressure. Set to "" to disable the fallback.
fallback_model_size = "large-v3-turbo"
# if you want to use GPU, set device="cuda"
device = "cpu"
compute_type = "int8"
# Optional vocabulary hint for transcription, e.g. "MoneyPrinterTurbo, İstanbul".
initial_prompt = ""

# =============================================================================
# Material Request Proxy / 素材请求代理
# =============================================================================

[proxy]
# Optional proxy used by Pexels, Pixabay, Coverr, and material downloads.
# Format: "http://<username>:<password>@<proxy>:<port>"
# Documentation: https://requests.readthedocs.io/en/latest/user/advanced/#proxies
# http = "http://127.0.0.1:3128"
# https = "http://127.0.0.1:1080"

# =============================================================================
# TTS Providers / 语音合成服务
# =============================================================================

[azure]
# Azure Speech TTS credentials. These are separate from Azure OpenAI settings.
# API key: https://portal.azure.com/#view/Microsoft_Azure_ProjectOxford/CognitiveServicesHub/~/SpeechServices
speech_key = ""
speech_region = ""

[siliconflow]
# SiliconFlow TTS API key: https://siliconflow.cn/
api_key = ""

[elevenlabs]
# API key: https://elevenlabs.io/app/settings/api-keys
# Available voices are shown in the WebUI. Voice Library entries are hidden
# automatically on free accounts because ElevenLabs blocks their API use.
api_key = ""
# Available models include eleven_multilingual_v2, eleven_flash_v2_5, and eleven_v3.
model_id = "eleven_multilingual_v2"
# Video-to-Music uses a separate model family while sharing the same API key.
music_model_id = "music_v2"
music_timeout = 600

# Chatterbox TTS (self-hosted, OpenAI-compatible) ##########################
# Chatterbox (https://github.com/resemble-ai/chatterbox, MIT) is an open-source,
# locally hosted TTS model with zero-shot voice cloning - a self-hostable
# alternative to ElevenLabs. Run a server that exposes an OpenAI-compatible
# endpoint at POST {base_url}/audio/speech (e.g. devnen/Chatterbox-TTS-Server
# or travisvn/chatterbox-tts-api), then set base_url below. In the WebUI pick
# "Chatterbox TTS" as the TTS server, or via the API pass a voice_name like
# "chatterbox:<voice>". Subtitles use the full-text fallback (no word-level
# timestamps); set subtitle_provider = "whisper" for tighter sync.
[chatterbox]
# OpenAI-compatible Chatterbox TTS server. The defaults target
# travisvn/chatterbox-tts-api running locally on port 4123.
base_url = "http://127.0.0.1:4123/v1"
api_key = ""
model_id = "chatterbox"
# Voice names exposed by the configured Chatterbox server.
voices = ["default-Female"]

# =============================================================================
# WebUI Preferences / WebUI 偏好
# =============================================================================

[ui]
# Hide generation logs in the WebUI.
hide_log = false

# The WebUI writes the remaining preferences automatically. Uncomment values
# below only when you want to define initial defaults manually.
# language = "zh"
# tts_server = "azure-tts-v1"
# voice_name = ""
# font_name = "MicrosoftYaHeiBold.ttc"
# font_size = 60
# text_fore_color = "#FFFFFF"
# subtitle_position = "bottom" # "top", "center", "bottom", or "custom"
# custom_position = 70.0       # Percentage from the top when using "custom"
# subtitle_background_enabled = false
# subtitle_background_color = "#000000"
# rounded_subtitle_background = false
# outro_image_file = "resource/branding/cebin_bilimi_outro.jpeg"
# outro_duration = 2.0
