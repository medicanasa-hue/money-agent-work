# MoneyPrinterTurbo configuration example.
# The app copies this file to config.toml on first run. Keep API keys and other
# credentials in config.toml; do not commit your local config.toml.

# =============================================================================
# API Service / API 服务
# =============================================================================
# Log level: DEBUG, INFO, WARNING, or ERROR.
log_level = "DEBUG"
# Use 127.0.0.1 for local-only access. 0.0.0.0 listens on all network interfaces.
listen_host = "0.0.0.0"
listen_port = 8080

[app]
# Show a local Windows notification when a scheduled job needs attention.
# This remains disabled by default for new installations.
scheduled_job_windows_notifications = false
# Show a local Windows notification when the rolling render-quality baseline finds a new issue.
# This remains disabled by default for new installations.
render_quality_windows_notifications = false
video_source = "pexels" # "pexels", "pixabay", "coverr", "dvids", "vecteezy", "nasa", "noaa_ocean", "loc", "wikimedia", "archive_org", "local", or "multi"

# Optional API key for the local HTTP API. Leave empty for private loopback-only use.
# Set this when listen_host is 0.0.0.0 or any non-loopback address.
api_key = ""
# When api_key is set, temporarily block repeated invalid attempts from one client.
# api_auth_max_failures = 5
# api_auth_failure_window_seconds = 60

# Keep a redacted, daily local application log under storage/logs.
# log_file_enabled = true
# log_retention_days = 14

# -----------------------------------------------------------------------------
# General / 通用设置
# -----------------------------------------------------------------------------

# Hide the basic configuration panel in the WebUI.
# 是否隐藏 WebUI 基础配置面板。
hide_config = false

# Optional warning-only viral quality gate for WebUI preflight analysis.
# Disabled by default; when enabled it warns below the threshold but never blocks generation.
viral_quality_gate_enabled = false
viral_quality_gate_threshold = 60

# Batch video rendering stays sequential to protect the GPU/FFmpeg pipeline.
# This only limits parallel network-only enrichment after the renders complete
# (social metadata and viral analysis). Set to 1 to disable parallel calls.
batch_network_workers = 2

# Optional named jobs for Windows Task Scheduler or cron-like runners.
# Scheduled jobs always enforce the quality threshold and keep publishing in
# the review queue, regardless of viral_quality_gate_enabled above.
# [[app.scheduled_jobs]]
# name = "weekday-finance"
# enabled = true
# video_subject = "Why grocery prices can rise before wages do"
# video_script = ""
# Optional: use a fresh topic from this pool on each run. Keep video_script blank
# so a matching script is generated for the selected topic.
# video_subject_pool = ["Why grocery prices can rise", "How interest rates affect rent"]
# Optional: use fresh Google News RSS headlines for this query after the pool.
# rss_trend_query = "personal finance"
# Optional: request RSS headlines in a specific language/region, for example
# Turkish headlines for a Turkish scheduled job.
# rss_trend_language = "tr-TR"
# Optional: when a fixed topic was used recently, skip this run without an error.
# skip_if_recent_duplicate = true
# Optional: for a matching subject, language, and aspect ratio, prefer a local
# silent OpenMontage render. If no native output exists, the normal stock-video
# source is used instead; no landscape render is cropped into a vertical job.
# openmontage_auto_materials = true

# Azure TTS V1(edge_tts) 单次流式请求超时时间，单位秒。
# 网络异常、服务端限流或 voice 与文本语言不匹配时，edge_tts 可能长期卡住。
# 默认 30 秒可避免 WebUI 任务无反馈；慢网络或代理环境可适当调大。
# 设置为 0 表示禁用超时。
edge_tts_timeout = 30

# Optional backup voices for failed generated narration. Disabled unless this
# list is filled explicitly; each value uses the same full voice name format
# as voice_name. Never used for no-voice or manually supplied audio.
# tts_fallback_voice_names = ["tr-TR-EmelNeural-Female"]

# 是否校验外部 API 和素材下载的 TLS 证书。
# 默认必须开启，避免 Pexels/Pixabay API key 和下载素材被中间人攻击篡改。
# 只有在企业代理或自签证书环境明确需要时，才临时改为 false。
tls_verify = true

# -----------------------------------------------------------------------------
# Video Materials / 视频素材
# -----------------------------------------------------------------------------

# API key lists support key rotation. Use straight ASCII double quotes and
# separate multiple keys with commas, for example: ["key-1", "key-2"].
# Key 必须使用英文半角双引号，多个 Key 使用英文逗号分隔。

# Register at https://www.pexels.com/api/
pexels_api_keys = []

# Register at https://pixabay.com/api/docs/
pixabay_api_keys = []

# Register at https://coverr.co/developers?ctx=header_navigation
coverr_api_keys = []

# Vecteezy Free API credentials
# Register at https://www.vecteezy.com/developers. The Free plan allows up to
# 500 downloads per month and requires attribution for its Free License.
# This provider only requests a download URL after MPT has selected a clip, so
# search results do not consume the download quota. Keep this source disabled
# until both values are configured in the WebUI or here.
# vecteezy_api_keys = ["your-vecteezy-api-key"]
vecteezy_api_keys = []
# Find the numeric account ID in the Vecteezy developer dashboard.
vecteezy_account_id = ""

# Smithsonian Open Access API Key (CC0 photo fallback)
# Obtain a free personal key at https://api.data.gov/. This source is used only
# when video material is insufficient; MPT accepts only high-resolution images
# whose Smithsonian media record is explicitly marked CC0.
smithsonian_api_keys = []

# Openverse CC0/Public Domain photo fallback
# No API key is needed for the low-volume fallback search. It runs only after
# video material is insufficient and accepts exact CC0 or Public Domain Mark
# images; set false to keep photo fallback limited to configured providers.
openverse_photo_fallback_enabled = true

# Europeana CC0/Public Domain photo fallback
# Register a free personal key at https://api.europeana.eu/. Europeana's broad
# open-content filter can include CC BY material, so MPT checks each record and
# accepts only exact CC0 or Public Domain Mark rights before downloading it.
europeana_api_keys = []
europeana_photo_fallback_enabled = true

# Met and Art Institute of Chicago public-domain artwork photo fallback
# No API key is needed. These are last-resort still-image sources: MPT searches
# them only if the configured photo sources cannot fill the video timeline.
museum_photo_fallback_enabled = true

# DVIDS Public Media API Key
# Register at https://api.dvidshub.net/docs to obtain a free public API key.
# DVIDS returns HD DoD and federal-agency footage. The provider preserves the
# requested credit and skips an asset when its API metadata explicitly marks
# the rights as restricted.
dvids_api_keys = []

# TwelveLabs API Key (optional) — https://twelvelabs.io
# TwelveLabs (可选) 视频理解 / 多模态嵌入集成。
# Enables two opt-in features:
#   * Marengo (multimodal embeddings) semantically reorders the auto-generated
#     search terms by relevance to your video subject, so the most on-topic
#     B-roll is downloaded first when the timeline budget is tight.
#   * Pegasus (video understanding) can QA / describe a clip from its URL.
# Leave empty to keep MoneyPrinterTurbo's behavior completely unchanged.
# Configure a TwelveLabs API key from the TwelveLabs dashboard (https://twelvelabs.io) and install the
# optional dependency with `uv sync --extra twelvelabs`.
# Register at https://playground.twelvelabs.io to get your API key.
# You can use multiple keys to avoid rate limits.
# For example: twelvelabs_api_keys = ["tlk_123adsf4567","tlk_abd1321cd13ef"]
# 请使用英文半角双引号包裹每个 Key；从富文本复制来的弯引号会导致 TOML 解析失败。
twelvelabs_api_keys = []
# Reorder search terms using Marengo before downloading materials. This option
# is ignored when match_materials_to_script is enabled.
twelvelabs_rerank_terms = false

# Optional Marengo material reranking. Metadata reranking uses provider titles/tags;
# visual reranking sends only a small number of direct public clip URLs to Marengo
# so it can rank actual video content against the scene query. Keep the visual
# limit small while evaluating the free plan.
twelvelabs_material_rerank_enabled = false
twelvelabs_material_rerank_max_candidates = 6
twelvelabs_visual_rerank_enabled = false
twelvelabs_visual_rerank_max_candidates = 2

# Optional Pegasus clip QA. It only reviews public provider URLs and rejects a
# clip only when Pegasus answers an explicit FAIL; network/API/ambiguous results
# keep the original candidate. Keep the limit small while evaluating the free plan.
twelvelabs_clip_qa_enabled = false
twelvelabs_clip_qa_max_candidates = 2

# Optional semantic duplicate check for scheduled-job subject pools and RSS
# headlines. It uses Marengo only after the existing text comparison is
# inconclusive, and checks at most this many recent subjects per candidate.
twelvelabs_semantic_duplicate_check = false
twelvelabs_semantic_duplicate_max_candidates = 12
twelvelabs_semantic_duplicate_threshold = 0.82

# Optional model overrides (defaults shown).
# twelvelabs_marengo_model = "marengo3.0"
# twelvelabs_pegasus_model = "pegasus1.5"

# Match search terms and downloaded materials to the script narrative order.
# 默认关闭，开启后会减少随机性，使素材顺序更贴近文案结构。
match_materials_to_script = false

# Optional Sonilo video-matched original background music.
# Create a key at https://platform.sonilo.com/dashboard. The WebUI can also save
# this value, or you can set the SONILO_API_KEY environment variable instead.
sonilo_api_key = ""
sonilo_base_url = "https://api.sonilo.com"
# 单次生成流连续无数据时的最长等待秒数；它不是整个请求的总耗时上限。
sonilo_timeout = 600

# -----------------------------------------------------------------------------
# LLM Providers / 大模型提供商
# -----------------------------------------------------------------------------

# Provider definitions, default models, and default Base URLs are maintained in
# app/models/llm_provider.py. Leave model_name and base_url empty to follow the
# Registry defaults; only set them when you need an explicit override.
llm_provider = "moonshot"
# Optional explicit provider fallback sequence. Providers are tried only after
# the primary provider fails and only when their credentials are configured.
llm_fallback_providers = []
# Scheduled jobs may use a separate fallback order.
scheduled_llm_fallback_providers = []

# Optional rough cost estimates for history and WebUI summaries. Unknown costs
# stay unknown; they are never silently treated as free.
# cost_estimate_llm_usd_per_million_characters = 1.23
# cost_estimate_tts_usd_per_million_characters = 4.56
# cost_estimate_monthly_warning_usd = 25.00
# cost_estimate_monthly_cap_usd = 25.00

# Kimi / Moonshot AI
# API key: https://platform.kimi.com/console/api-keys
moonshot_api_key = ""
moonshot_base_url = ""
moonshot_model_name = ""

# OpenAI or another OpenAI Chat Completions-compatible provider.
# API key: https://platform.openai.com/api-keys
openai_api_key = ""
openai_base_url = ""
openai_model_name = ""

# Google Gemini
